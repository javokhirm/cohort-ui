# Frontend stack. Deployed to BOTH /opt/cohort/web-prod and /opt/cohort/web-dev
# on the single VPS. Everything that differs between envs comes from the .env
# file sitting next to this one (see .env.server.example):
#   COMPOSE_PROJECT_NAME=cohort-web-prod  (or cohort-web-dev)
#   ADMIN_ALIAS=web-admin-prod            (or web-admin-dev)    -> Caddy upstream
#   INTERNAL_ALIAS=web-internal-prod      (or web-internal-dev) -> Caddy upstream
#   TEACH_ALIAS=web-teach-prod            (or web-teach-dev)    -> Caddy upstream
#   STUDENT_ALIAS=web-student-prod        (or web-student-dev)  -> Caddy upstream
#   PARENT_ALIAS=web-parent-prod          (or web-parent-dev)   -> Caddy upstream
#   ADMIN_IMAGE / INTERNAL_IMAGE / TEACH_IMAGE / STUDENT_IMAGE / PARENT_IMAGE
#                                         -> overridden per-SHA by the deploy workflow
#
# No host ports — the shared `edge` network + Caddy front everything (TLS via
# Let's Encrypt lives in cohort-be/deploy/Caddyfile).

networks:
  edge:
    external: true # created once on the VPS: `docker network create edge`

x-web: &web
  restart: always
  mem_limit: 64m # static nginx needs ~5 MB; the cap protects the shared VPS
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web-admin:
    <<: *web
    image: ${ADMIN_IMAGE}
    networks:
      edge:
        aliases: ["${ADMIN_ALIAS}"]

  web-internal:
    <<: *web
    image: ${INTERNAL_IMAGE}
    networks:
      edge:
        aliases: ["${INTERNAL_ALIAS}"]

  web-teach:
    <<: *web
    image: ${TEACH_IMAGE}
    networks:
      edge:
        aliases: ["${TEACH_ALIAS}"]

  # Student and parent apps: two shells over the one /api/v1/portal/* surface,
  # which the backend has not built yet — both ship a placeholder page for now.
  web-student:
    <<: *web
    image: ${STUDENT_IMAGE}
    networks:
      edge:
        aliases: ["${STUDENT_ALIAS}"]

  web-parent:
    <<: *web
    image: ${PARENT_IMAGE}
    networks:
      edge:
        aliases: ["${PARENT_ALIAS}"]
