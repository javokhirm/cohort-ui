# Serves one built Vite SPA. TLS, HSTS, security headers and gzip/zstd are
# handled by the edge Caddy (cohort-be/deploy/Caddyfile) — keep this minimal.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Healthcheck target for compose `--wait` and manual probes.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames under /assets — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # NEVER cache the entry point: after a deploy the browser must re-fetch
    # index.html, or it will request old hashed chunks that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links and hard refreshes on client routes resolve to
    # index.html; the client-side router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
