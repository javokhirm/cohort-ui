name: Deploy Web Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-web-dev
  cancel-in-progress: true # a newer dev push supersedes an in-flight one

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: admin
            image: cohort-web-admin
          - app: internal-platform
            image: cohort-web-internal
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_ORIGIN=${{ vars.DEV_API_ORIGIN }}
            VITE_APP_ENV=staging
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:dev
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (web-dev stack)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/cohort/web-dev
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export ADMIN_IMAGE=ghcr.io/${{ github.repository_owner }}/cohort-web-admin:${{ github.sha }}
            export INTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/cohort-web-internal:${{ github.sha }}
            COMPOSE="docker compose -f docker-compose.web.yml"

            $COMPOSE pull
            $COMPOSE up -d --no-deps --wait web-admin web-internal
            docker image prune -f
