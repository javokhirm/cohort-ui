name: Deploy Web Prod

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run, e.g. after changing a VITE_* repo variable

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false # never abort a production deploy mid-flight

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # When ci.yml lands in this repo, gate the deploy on it like the backend does:
  # test:
  #   uses: ./.github/workflows/ci.yml
  # ...and add `needs: test` to the build job.

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: admin
            image: cohort-web-admin
          - app: internal-platform
            image: cohort-web-internal
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are compile-time and public (they ship in the JS bundle),
      # so they come from repository *variables*, not secrets.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_ORIGIN=${{ vars.PROD_API_ORIGIN }}
            VITE_APP_ENV=production
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Zero-downtime deploy to VPS (web-prod stack)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/cohort/web-prod
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export ADMIN_IMAGE=ghcr.io/${{ github.repository_owner }}/cohort-web-admin:${{ github.sha }}
            export INTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/cohort-web-internal:${{ github.sha }}
            COMPOSE="docker compose -f docker-compose.web.yml"

            $COMPOSE pull
            # Recreate on the new images; --wait blocks until healthchecks pass.
            # The edge Caddy's lb_try_duration bridges the ~1s swap, so no 502s.
            $COMPOSE up -d --no-deps --wait web-admin web-internal
            docker image prune -f
