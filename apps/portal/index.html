<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Portal</title>
		<script>
			// Resolve the theme before the stylesheet paints, so the page never flashes
			// the wrong palette. Mirrors `initTheme` in @repo/ui, which owns the state
			// from boot onwards — keep the storage key in step with main.tsx.
			(function () {
				try {
					var stored = localStorage.getItem('cohort.portal.theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					/* storage blocked — fall through to the light default */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
